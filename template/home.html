  <style>
    .home__head { padding: 28px 8px 6px; }
    .home__date {
      display: inline-block; padding: 4px 14px; border-radius: 999px;
      background: rgba(255, 255, 255, .7); color: var(--rose-deep);
      font: 600 .85rem var(--f-body); letter-spacing: .04em;
    }
    .home__title {
      margin-top: 12px;
      font: 400 clamp(2rem, 9vw, 2.8rem)/1.15 var(--f-display);
      color: var(--ink);
    }
    .home__title .heart-ico { color: var(--rose); font-size: .7em; }
    .nowrap { white-space: nowrap; }
    .home__title, .home__lead { text-wrap: balance; }
    .home__lead { margin-top: 8px; font: clamp(1.1rem, 4.4vw, 1.3rem)/1.4 var(--f-hand); color: var(--ink-soft); }

    .kids { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 12px; text-align: left; }
    .kid {
      position: relative;
      display: grid; grid-template-columns: 64px 1fr 48px; align-items: center; gap: 14px;
      padding: 12px 12px 12px 14px;
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 6px 22px rgba(232, 88, 122, .12);
      transition: transform .2s, box-shadow .2s;
    }
    .kid:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(232, 88, 122, .2); }
    .kid__avatar {
      width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #fff 0%, var(--blush) 75%);
      border: 3px solid #fff; box-shadow: 0 0 0 2px var(--rose-soft);
    }
    .kid__avatar img { width: 100%; height: 100%; object-fit: cover; object-position: var(--focus, 50% 25%); display: block; }
    .kid__body { min-width: 0; }
    .kid__name { display: block; font: 700 1.15rem/1.2 var(--f-title); color: var(--ink); }
    /* The whole card opens the kid's page */
    .kid__name a { color: inherit; text-decoration: none; }
    .kid__name a::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
    .kid__name a:focus-visible::after { outline: 3px solid var(--rose); outline-offset: 2px; }
    .kid__wish {
      margin-top: 2px;
      font: 1.02rem/1.35 var(--f-hand); color: var(--ink-soft);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .kid__play {
      position: relative; z-index: 1;
      width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #f27b98, var(--rose-deep));
      box-shadow: 0 6px 14px rgba(217, 68, 106, .35);
      color: #fff;
    }
    .kid__play svg { width: 20px; height: 20px; fill: currentColor; }
    .kid__play .i-pause, .kid__play[aria-pressed="true"] .i-play { display: none; }
    .kid__play[aria-pressed="true"] .i-pause { display: block; }
    .kid__play[aria-pressed="true"] { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(232, 88, 122, .18), 0 6px 14px rgba(217, 68, 106, .35); } }
    @media (prefers-reduced-motion: reduce) { .kid, .kid__play { transition: none; animation: none !important; } }

    .home__foot { margin-top: 28px; font: 1.05rem var(--f-hand); color: var(--muted); }
  </style>

  <script>
    // Listen right from the list: one shared player, one recording at a time
    (() => {
      const audio = new Audio();
      let current = null;
      const set = (btn, on) => {
        btn.setAttribute("aria-pressed", String(on));
        btn.setAttribute("aria-label", (on ? "Tạm dừng" : "Nghe") + " lời chúc của bé " + btn.dataset.name);
      };
      document.querySelectorAll(".kid__play").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (current === btn && !audio.paused) { audio.pause(); return; }
          if (current !== btn) {
            if (current) set(current, false);
            current = btn;
            audio.src = btn.dataset.src;
          }
          audio.play().catch(() => set(btn, false));
        });
      });
      audio.addEventListener("play", () => current && set(current, true));
      audio.addEventListener("pause", () => current && set(current, false));
      audio.addEventListener("ended", () => { if (current) set(current, false); audio.currentTime = 0; });
    })();
  </script>
